<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Periodic Table of Elements - HaptixUI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><circle cx='12' cy='12' r='10'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-hover: rgba(255, 255, 255, 0.28);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #07090e;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      user-select: none;
      touch-action: none;
    }

    /* Top Ambient Navigation Toolbar */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      background: rgba(7, 9, 14, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    .header-left, .header-center, .header-right {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: #0c111d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo-img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .brand-title span {
      color: #38bdf8;
    }

    .badge-sub {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Mode Switcher Buttons */
    .mode-switcher {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px;
      background: #0c111d;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      box-shadow: 0 10px 24px -4px rgba(0, 0, 0, 0.75);
    }

    .mode-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mode-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .mode-btn.active {
      color: #0f172a;
      background: #38bdf8;
      box-shadow: 0 0 0 1.5px #38bdf8;
    }

    .mode-btn svg {
      width: 15px;
      height: 15px;
    }

    /* Search & Control Tools */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 180px;
      height: 38px;
      padding: 0 14px 0 36px;
      background: #0c111d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      font-family: inherit;
      font-size: 13px;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      width: 220px;
      border-color: #38bdf8;
      box-shadow: 0 0 0 1.5px #38bdf8;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      width: 15px;
      height: 15px;
      color: #64748b;
      pointer-events: none;
    }

    .tool-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0c111d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
      background: #161e31;
    }

    .tool-btn.active {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }

    /* 3D Viewport Scene */
    .viewport-scene {
      width: 100vw;
      height: 100vh;
      perspective: 1200px;
      overflow: hidden;
      cursor: grab;
      position: relative;
    }

    .viewport-scene:active {
      cursor: grabbing;
    }

    /* The 3D World container containing all element cards */
    .world-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* Element Card Style - Pure solid dark & razor sharp highlight rim */
    .element-card {
      position: absolute;
      left: 0;
      top: 0;
      width: 96px;
      height: 128px;
      margin-left: -48px;
      margin-top: -64px;
      border-radius: 12px;
      background: #0d1322;
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 9px 8px 8px 8px;
      cursor: pointer;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform, opacity;
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 10px 24px -4px rgba(0, 0, 0, 0.75);
    }

    .element-card:hover {
      background: #141d33;
      border-color: #ffffff;
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 12px 28px -4px rgba(0, 0, 0, 0.85);
      z-index: 1000 !important;
    }

    .element-card.dimmed {
      opacity: 0.14 !important;
    }

    .element-card.highlighted {
      border-color: var(--cat-color);
      box-shadow: 0 0 0 2px var(--cat-color), 0 10px 24px -4px rgba(0, 0, 0, 0.85);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .card-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
    }

    .card-mass {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
    }

    .card-symbol {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      color: var(--cat-color);
      margin: 4px 0 2px 0;
      letter-spacing: -0.03em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .card-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .card-name {
      font-size: 10px;
      font-weight: 700;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80px;
      text-align: center;
    }

    /* Bottom Category Legend Bar */
    .category-legend {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #0c111d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      z-index: 100;
      box-shadow: 0 10px 24px -4px rgba(0, 0, 0, 0.75);
      max-width: 95vw;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .legend-chip:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .legend-chip.active {
      background: rgba(255, 255, 255, 0.14);
      border-color: currentColor;
    }

    .chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Modal Element Inspector */
    .element-modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(12px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 20px;
    }

    .element-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: #0d1322;
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 48px -8px rgba(0, 0, 0, 0.85);
      position: relative;
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .element-modal.open .modal-card {
      transform: scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.15s ease;
    }

    .modal-close-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.16);
    }

    .modal-hero {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .modal-symbol-box {
      width: 90px;
      height: 110px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--cat-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.5);
    }

    .modal-symbol-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
    }

    .modal-symbol-text {
      font-size: 38px;
      font-weight: 800;
      color: var(--cat-color);
      line-height: 1;
      margin: 4px 0;
    }

    .modal-symbol-mass {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
    }

    .modal-hero-info h2 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .modal-hero-info .modal-cat-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 9999px;
      background: var(--cat-bg);
      color: var(--cat-color);
      border: 1px solid var(--cat-color);
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .modal-stat {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    .modal-stat-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .modal-stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      .app-header {
        height: auto;
        padding: 12px 14px;
        flex-direction: column;
        gap: 10px;
        background: rgba(7, 9, 14, 0.95);
      }

      .header-center {
        width: 100%;
        justify-content: center;
      }

      .mode-switcher {
        width: 100%;
        justify-content: space-between;
      }

      .mode-btn {
        padding: 6px 12px;
        font-size: 12px;
      }

      .search-box {
        display: none;
      }

      .category-legend {
        bottom: 10px;
        padding: 6px 10px;
        font-size: 10px;
      }

      .element-card {
        width: 76px;
        height: 102px;
        margin-left: -38px;
        margin-top: -51px;
      }

      .card-symbol {
        font-size: 24px;
      }

      .card-name {
        font-size: 8.5px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation & Controls -->
  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="brand-pill" title="Back to HaptixUI Catalog">
        <img src="haptixui_logo.jpg" alt="HaptixUI" class="brand-logo-img">
        <div class="brand-title">Haptix<span>UI</span></div>
        <span class="badge-sub">3D Element Labs</span>
      </a>
    </div>

    <div class="header-center">
      <div class="mode-switcher" id="modeSwitcher">
        <button class="mode-btn active" data-mode="table" id="btnModeTable">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Table
        </button>
        <button class="mode-btn" data-mode="sphere" id="btnModeSphere">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Sphere
        </button>
        <button class="mode-btn" data-mode="helix" id="btnModeHelix">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12c4-8 12-8 16 0s-12 8-16 0z"/><path d="M4 6c4-8 12-8 16 0"/><path d="M4 18c4 8 12 8 16 0"/></svg>
          Helix
        </button>
        <button class="mode-btn" data-mode="grid" id="btnModeGrid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          Grid 3D
        </button>
      </div>
    </div>

    <div class="header-right">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="search-input" id="elementSearch" placeholder="Search (e.g. Au, Carbon)...">
      </div>

      <button class="tool-btn" id="btnAutoSpin" title="Toggle Auto-Rotation">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      </button>

      <button class="tool-btn" id="btnResetView" title="Reset Camera Perspective">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </header>

  <!-- 3D Interactive Scene Container -->
  <main class="viewport-scene" id="viewportScene">
    <div class="world-container" id="worldContainer">
      <!-- 118 Element Cards generated dynamically here -->
    </div>
  </main>

  <!-- Bottom Categories Legend Strip -->
  <footer class="category-legend" id="categoryLegend">
    <!-- Populated dynamically with category filters -->
  </footer>

  <!-- Modal Element Detailed Inspector -->
  <div class="element-modal" id="elementModal">
    <div class="modal-card" id="modalCard">
      <button class="modal-close-btn" id="modalCloseBtn">✕</button>
      <div class="modal-hero">
        <div class="modal-symbol-box" id="modalBox">
          <span class="modal-symbol-num" id="modalNum">1</span>
          <span class="modal-symbol-text" id="modalSymbol">H</span>
          <span class="modal-symbol-mass" id="modalMass">1.008</span>
        </div>
        <div class="modal-hero-info">
          <h2 id="modalName">Hydrogen</h2>
          <span class="modal-cat-badge" id="modalCategory">Nonmetal</span>
        </div>
      </div>
      <div class="modal-grid">
        <div class="modal-stat">
          <div class="modal-stat-label">Atomic Number</div>
          <div class="modal-stat-val" id="modalStatNum">1</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-label">Atomic Mass</div>
          <div class="modal-stat-val" id="modalStatMass">1.008 u</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-label">Group / Period</div>
          <div class="modal-stat-val" id="modalStatGroup">Group 1, Period 1</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-label">Standard State</div>
          <div class="modal-stat-val" id="modalStatState">Gas at 298 K</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { ELEMENTS, CATEGORIES } from './periodic_data.js';

    // DOM Elements
    const scene = document.getElementById('viewportScene');
    const world = document.getElementById('worldContainer');
    const modeButtons = document.querySelectorAll('.mode-btn');
    const autoSpinBtn = document.getElementById('btnAutoSpin');
    const resetViewBtn = document.getElementById('btnResetView');
    const searchInput = document.getElementById('elementSearch');
    const legendContainer = document.getElementById('categoryLegend');

    // Modal elements
    const modal = document.getElementById('elementModal');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalBox = document.getElementById('modalBox');
    const modalNum = document.getElementById('modalNum');
    const modalSymbol = document.getElementById('modalSymbol');
    const modalMass = document.getElementById('modalMass');
    const modalName = document.getElementById('modalName');
    const modalCategory = document.getElementById('modalCategory');
    const modalStatNum = document.getElementById('modalStatNum');
    const modalStatMass = document.getElementById('modalStatMass');
    const modalStatGroup = document.getElementById('modalStatGroup');
    const modalStatState = document.getElementById('modalStatState');

    // Camera & Orbit State
    let currentMode = 'table'; // 'table' | 'sphere' | 'helix' | 'grid'
    let cameraZ = window.innerWidth < 768 ? -2400 : -1650;
    let targetCameraZ = cameraZ;
    let rotX = 0, rotY = 0;
    let targetRotX = 0, targetRotY = 0;
    let velX = 0, velY = 0;
    let isDragging = false;
    let lastMouseX = 0, lastMouseY = 0;
    let autoSpin = false;
    let activeFilterCategory = null;

    // Card Node References and Target Positions
    const cardNodes = [];

    // Layout Generators for 118 Elements
    function computeTargets(mode) {
      const N = ELEMENTS.length; // 118

      ELEMENTS.forEach((el, i) => {
        const item = cardNodes[i];
        if (!item) return;

        let tx = 0, ty = 0, tz = 0, trx = 0, try_ = 0, trz = 0;

        if (mode === 'table') {
          // 18 columns, rows 1-7 for main table. Lanthanides & Actinides at rows 8.4 & 9.6
          const spacingX = window.innerWidth < 768 ? 92 : 112;
          const spacingY = window.innerWidth < 768 ? 122 : 146;
          tx = (el.group - 9.5) * spacingX;
          ty = (el.period - 5) * spacingY;
          tz = 0;
          trx = 0;
          try_ = 0;
          trz = 0;
        } else if (mode === 'sphere') {
          // Fibonacci Planetary Sphere - outward radial facing
          const radius = window.innerWidth < 768 ? 620 : 820;
          const phi = Math.acos(-1 + (2 * i) / N);
          const theta = Math.sqrt(N * Math.PI) * phi;

          tx = radius * Math.sin(phi) * Math.sin(theta);
          ty = -radius * Math.cos(phi);
          tz = radius * Math.sin(phi) * Math.cos(theta);

          try_ = theta * (180 / Math.PI);
          trx = -(phi - Math.PI / 2) * (180 / Math.PI);
          trz = 0;
        } else if (mode === 'helix') {
          // Cylindrical Multi-Wound Spiral Helix
          const radius = window.innerWidth < 768 ? 580 : 760;
          const theta = i * 0.175 + Math.PI;
          const y = -(i * 12) + 700;

          tx = radius * Math.sin(theta);
          ty = y;
          tz = radius * Math.cos(theta);

          try_ = theta * (180 / Math.PI);
          trx = 0;
          trz = 0;
        } else if (mode === 'grid') {
          // 3D Cube Grid Lattice (5 x 5 x 5)
          const spacing = window.innerWidth < 768 ? 170 : 220;
          const gx = (i % 5) - 2;
          const gy = (Math.floor(i / 5) % 5) - 2;
          const gz = Math.floor(i / 25) - 2;

          tx = gx * spacing;
          ty = -gy * spacing;
          tz = gz * spacing;

          trx = 0;
          try_ = 0;
          trz = 0;
        }

        item.target = { x: tx, y: ty, z: tz, rx: trx, ry: try_, rz: trz };
      });
    }

    // Initialize Element Cards in DOM
    function initCards() {
      world.innerHTML = '';
      cardNodes.length = 0;

      ELEMENTS.forEach((el, i) => {
        const catInfo = CATEGORIES[el.category] || { color: '#38bdf8', bg: 'rgba(56, 189, 248, 0.15)', label: 'Element' };

        const card = document.createElement('div');
        card.className = 'element-card';
        card.style.setProperty('--cat-color', catInfo.color);
        card.style.setProperty('--cat-bg', catInfo.bg);

        card.innerHTML = `
          <div class="card-top">
            <span class="card-num">${el.number}</span>
            <span class="card-mass">${el.mass}</span>
          </div>
          <div class="card-symbol">${el.symbol}</div>
          <div class="card-bottom">
            <span class="card-name" title="${el.name}">${el.name}</span>
          </div>
        `;

        // Click to view element details
        card.addEventListener('click', (e) => {
          e.stopPropagation();
          openElementModal(el, catInfo);
        });

        world.appendChild(card);

        // Store positions and velocity for smooth interpolation
        cardNodes.push({
          el: card,
          data: el,
          catInfo,
          cur: {
            x: (Math.random() - 0.5) * 1200,
            y: (Math.random() - 0.5) * 1200,
            z: (Math.random() - 0.5) * 1200,
            rx: 0,
            ry: 0,
            rz: 0
          },
          target: { x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0 }
        });
      });

      computeTargets(currentMode);
    }

    // Build Category Legend Filter Chips
    function initLegend() {
      legendContainer.innerHTML = '';

      // All chip
      const allChip = document.createElement('div');
      allChip.className = 'legend-chip active';
      allChip.innerHTML = `<span class="chip-dot" style="background: #ffffff"></span> All Elements`;
      allChip.addEventListener('click', () => filterByCategory(null, allChip));
      legendContainer.appendChild(allChip);

      Object.entries(CATEGORIES).forEach(([key, info]) => {
        const chip = document.createElement('div');
        chip.className = 'legend-chip';
        chip.innerHTML = `<span class="chip-dot" style="background: ${info.color}"></span> ${info.label}`;
        chip.addEventListener('click', () => filterByCategory(key, chip));
        legendContainer.appendChild(chip);
      });
    }

    function filterByCategory(categoryKey, chipElem) {
      activeFilterCategory = categoryKey;
      document.querySelectorAll('.legend-chip').forEach(c => c.classList.remove('active'));
      chipElem.classList.add('active');

      cardNodes.forEach(item => {
        if (!categoryKey || item.data.category === categoryKey) {
          item.el.classList.remove('dimmed');
        } else {
          item.el.classList.add('dimmed');
        }
      });
    }

    // Search Filter
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        cardNodes.forEach(item => {
          item.el.classList.remove('dimmed', 'highlighted');
        });
        return;
      }

      cardNodes.forEach(item => {
        const matches = item.data.name.toLowerCase().includes(q) ||
                        item.data.symbol.toLowerCase() === q ||
                        String(item.data.number) === q;
        if (matches) {
          item.el.classList.remove('dimmed');
          item.el.classList.add('highlighted');
        } else {
          item.el.classList.add('dimmed');
          item.el.classList.remove('highlighted');
        }
      });
    });

    // Modal Inspector
    function openElementModal(el, catInfo) {
      modalBox.style.setProperty('--cat-color', catInfo.color);
      modalNum.textContent = el.number;
      modalSymbol.textContent = el.symbol;
      modalMass.textContent = el.mass;
      modalName.textContent = el.name;
      modalCategory.textContent = catInfo.label;
      modalCategory.style.setProperty('--cat-color', catInfo.color);
      modalCategory.style.setProperty('--cat-bg', catInfo.bg);
      modalStatNum.textContent = el.number;
      modalStatMass.textContent = `${el.mass} u`;
      modalStatGroup.textContent = `Group ${el.group}, Period ${el.period}`;

      const stateMap = {
        'H': 'Gas', 'He': 'Gas', 'N': 'Gas', 'O': 'Gas', 'F': 'Gas', 'Ne': 'Gas',
        'Cl': 'Gas', 'Ar': 'Gas', 'Kr': 'Gas', 'Xe': 'Gas', 'Rn': 'Gas',
        'Br': 'Liquid', 'Hg': 'Liquid'
      };
      modalStatState.textContent = (stateMap[el.symbol] || 'Solid') + ' at 298 K';

      modal.classList.add('open');
    }

    modalCloseBtn.addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    // Mode Switcher Buttons
    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;

        // Auto angle adjustments for best default view
        if (currentMode === 'table') {
          targetRotX = 0;
          targetRotY = 0;
          targetCameraZ = window.innerWidth < 768 ? -2400 : -1650;
        } else if (currentMode === 'sphere') {
          targetRotX = 12;
          targetRotY = -25;
          targetCameraZ = window.innerWidth < 768 ? -2200 : -1700;
        } else if (currentMode === 'helix') {
          targetRotX = 15;
          targetRotY = 45;
          targetCameraZ = window.innerWidth < 768 ? -2100 : -1600;
        } else if (currentMode === 'grid') {
          targetRotX = 22;
          targetRotY = 35;
          targetCameraZ = window.innerWidth < 768 ? -2000 : -1500;
        }

        computeTargets(currentMode);
      });
    });

    // Auto-spin Toggle
    autoSpinBtn.addEventListener('click', () => {
      autoSpin = !autoSpin;
      autoSpinBtn.classList.toggle('active', autoSpin);
    });

    // Reset View
    resetViewBtn.addEventListener('click', () => {
      targetRotX = currentMode === 'table' ? 0 : 15;
      targetRotY = currentMode === 'table' ? 0 : 25;
      targetCameraZ = window.innerWidth < 768 ? -2400 : -1650;
    });

    // Pointer Drag & Orbit Controls (UP drags UP, DOWN drags DOWN!)
    scene.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      velX = 0;
      velY = 0;
      scene.setPointerCapture?.(e.pointerId);
    });

    scene.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;

      velY = dx * 0.22;
      velX = -dy * 0.22; // Natural drag physics: drag up tilts model up!

      targetRotY += velY;
      targetRotX += velX;

      // Clamp X tilt between -75 and +75 deg
      targetRotX = Math.max(-75, Math.min(75, targetRotX));

      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    const stopDrag = () => { isDragging = false; };
    scene.addEventListener('pointerup', stopDrag);
    scene.addEventListener('pointercancel', stopDrag);

    // Zoom via Mouse Wheel & Touch Pinch
    scene.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetCameraZ += e.deltaY * -1.8;
      targetCameraZ = Math.max(-4200, Math.min(-600, targetCameraZ));
    }, { passive: false });

    // 60 FPS Main Render & Smooth Spring Interpolation Loop
    function animate() {
      // Auto-spin
      if (autoSpin && !isDragging) {
        targetRotY += 0.25;
      }

      // Camera Spring Easing
      rotX += (targetRotX - rotX) * 0.08;
      rotY += (targetRotY - rotY) * 0.08;
      cameraZ += (targetCameraZ - cameraZ) * 0.08;

      // Apply 3D World Transform
      world.style.transform = `translateZ(${cameraZ}px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;

      // Interpolate each element card towards its mode target
      const ease = 0.085;
      for (let i = 0; i < cardNodes.length; i++) {
        const item = cardNodes[i];
        const cur = item.cur;
        const tgt = item.target;

        cur.x += (tgt.x - cur.x) * ease;
        cur.y += (tgt.y - cur.y) * ease;
        cur.z += (tgt.z - cur.z) * ease;
        cur.rx += (tgt.rx - cur.rx) * ease;
        cur.ry += (tgt.ry - cur.ry) * ease;
        cur.rz += (tgt.rz - cur.rz) * ease;

        item.el.style.transform = `translate3d(${cur.x.toFixed(1)}px, ${cur.y.toFixed(1)}px, ${cur.z.toFixed(1)}px) rotateX(${cur.rx.toFixed(1)}deg) rotateY(${cur.ry.toFixed(1)}deg) rotateZ(${cur.rz.toFixed(1)}deg)`;
      }

      requestAnimationFrame(animate);
    }

    // Initialize Everything
    initCards();
    initLegend();
    requestAnimationFrame(animate);

    // Resize Handler
    window.addEventListener('resize', () => {
      computeTargets(currentMode);
    });
  </script>
</body>
</html>
