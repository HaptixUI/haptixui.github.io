<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Rotating Heart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #050002;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="heartCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    let width, height;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // 1. Parametric Heart Equations (Exact from Python script)
    function heartParametric(u) {
      const x = 1.6 * Math.pow(Math.sin(u), 3);
      const y = 1.3 * Math.cos(u) - 0.5 * Math.cos(2 * u) - 0.2 * Math.cos(3 * u) - 0.1 * Math.cos(4 * u);
      return { x, y };
    }

    // 2. Generate Volumetric 3D Points Cloud
    const N = 2800;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const u = Math.random() * Math.PI * 2;
      const { x: hx, y: hy } = heartParametric(u);
      const rad = Math.sqrt(Math.random());
      const x = hx * rad;
      const y = hy * rad;
      const z = 1.1 * (1 - rad) * (Math.random() * 2 - 1);
      pts.push({ x, y, z });
    }

    // 3. Color Depth Palette (Matches Python script #46000a -> #ff1e32)
    function getDepthColor(depth) {
      const f = Math.max(0.0, Math.min(1.0, depth));
      const r = Math.round(70 + (255 - 70) * f);
      const g = Math.round(0 + 30 * f);
      const b = Math.round(10 + (50 - 10) * f);
      return `rgb(${r}, ${g}, ${b})`;
    }

    // 4. Motion & Natural 3D Trackball Physics
    let theta = 0;
    let phi = 0;
    let velTheta = 0;
    let velPhi = 0;
    const idleSpeed = 0.028;
    let isDragging = false;
    let lastX = 0, lastY = 0;

    container.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      velTheta = 0;
      velPhi = 0;
      container.setPointerCapture?.(e.pointerId);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;

      // Natural trackball physics: drag up -> tilts up, drag down -> tilts down
      theta += dx * 0.01;
      phi += dy * 0.01;
      phi = Math.max(-0.75, Math.min(0.75, phi));

      velTheta = dx * 0.008;
      velPhi = dy * 0.008;

      lastX = e.clientX;
      lastY = e.clientY;
    });

    const stopDrag = () => { isDragging = false; };
    window.addEventListener('pointerup', stopDrag);
    window.addEventListener('pointercancel', stopDrag);

    // 5. 60 FPS Render Loop (Pure 3D Rotation, Inertia Physics)
    function render() {
      ctx.clearRect(0, 0, width, height);

      if (!isDragging) {
        theta += velTheta + idleSpeed;
        phi += velPhi;

        velTheta *= 0.93;
        velPhi *= 0.93;

        // Smoothly settle vertical pitch back toward center when idle
        phi += (0 - phi) * 0.025;
        phi = Math.max(-0.75, Math.min(0.75, phi));
      }

      const baseScale = Math.min(width, height) * 0.22;
      const cosT = Math.cos(theta), sinT = Math.sin(theta);
      const cosP = Math.cos(phi), sinP = Math.sin(phi);

      const projected = [];
      const len = pts.length;
      for (let i = 0; i < len; i++) {
        const pt = pts[i];
        const xr1 = pt.x * cosT + pt.z * sinT;
        const zr1 = -pt.x * sinT + pt.z * cosT;
        const yr1 = pt.y;

        const yr2 = yr1 * cosP - zr1 * sinP;
        const zr2 = yr1 * sinP + zr1 * cosP;
        const xr2 = xr1;

        projected.push({
          x: xr2,
          y: -yr2,
          z: zr2
        });
      }

      projected.sort((a, b) => a.z - b.z);

      const cx = width / 2;
      const cy = height / 2;

      // Render 3D Heart Points
      const pLen = projected.length;
      for (let i = 0; i < pLen; i++) {
        const p = projected[i];
        const depth = (p.z + 1.1) / 2.2;
        const px = cx + p.x * baseScale;
        const py = cy + p.y * baseScale;
        const dotSize = 1.3 + depth * 2.8;

        ctx.fillStyle = getDepthColor(depth);
        ctx.beginPath();
        ctx.arc(px, py, dotSize, 0, Math.PI * 2);
        ctx.fill();

        if (depth > 0.9 && i % 4 === 0) {
          ctx.fillStyle = 'rgba(255, 235, 245, 0.9)';
          ctx.beginPath();
          ctx.arc(px, py, dotSize * 0.55, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
